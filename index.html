<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#4F46E5">
<title>ÉcoleSync</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root {
  --bg: #F8FAFC;
  --card: #FFFFFF;
  --text: #0F172A;
  --text2: #64748B;
  --primary: #4F46E5;
  --primary-light: #EEF2FF;
  --green: #10B981;
  --red: #EF4444;
  --orange: #F59E0B;
  --pink: #EC4899;
  --blue: #3B82F6;
  --purple: #8B5CF6;
  --radius: 16px;
  --safe-top: env(safe-area-inset-top);
  --safe-bottom: env(safe-area-inset-bottom);
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif; }
body { background:var(--bg); color:var(--text); min-height:100vh; padding-top:var(--safe-top); padding-bottom:calc(95px + var(--safe-bottom)); }
.header { position:sticky; top:0; z-index:100; background:rgba(255,255,255,0.97); backdrop-filter:blur(20px); padding:14px 18px; border-bottom:1px solid #E2E8F0; display:flex; justify-content:space-between; align-items:center; }
.header h1 { font-size:20px; font-weight:800; color:var(--primary); }
.header-sub { font-size:12px; color:var(--text2); }
.nav { position:fixed; bottom:0; left:0; right:0; background:#fff; display:flex; justify-content:space-around; padding:10px 0 calc(14px + var(--safe-bottom)); border-top:1px solid #E2E8F0; z-index:100; box-shadow:0 -4px 20px rgba(0,0,0,0.05); }
.nav-item { display:flex; flex-direction:column; align-items:center; gap:3px; color:var(--text2); font-size:10px; font-weight:600; background:none; border:none; padding:6px 8px; }
.nav-item.active { color:var(--primary); }
.nav-item svg { width:24px; height:24px; }
.page { display:none; padding:16px; animation:fade 0.25s ease; }
.page.active { display:block; }
@keyframes fade { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:none; } }
.card { background:var(--card); border-radius:var(--radius); padding:16px; margin-bottom:14px; box-shadow:0 2px 12px rgba(0,0,0,0.04); border:1px solid #F1F5F9; }
.card-title { font-size:13px; color:var(--text2); font-weight:600; margin-bottom:8px; }
.btn { background:var(--primary); color:#fff; border:none; border-radius:12px; padding:14px; font-size:15px; font-weight:700; width:100%; }
.btn:active { opacity:0.85; }
.btn-secondary { background:#F1F5F9; color:var(--text); }
.btn-danger { background:var(--red); }
.btn-sm { padding:8px 14px; font-size:13px; width:auto; border-radius:10px; }
.child-chip { display:inline-flex; align-items:center; gap:8px; background:var(--primary-light); color:var(--primary); padding:8px 14px; border-radius:30px; font-weight:700; font-size:14px; margin:4px; cursor:pointer; border:2px solid transparent; }
.child-chip.active { border-color:var(--primary); background:var(--primary); color:#fff; }
.list-item { display:flex; align-items:center; gap:12px; padding:13px 0; border-bottom:1px solid #F1F5F9; cursor:pointer; }
.list-item:last-child { border-bottom:none; }
.icon-circle { width:42px; height:42px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:18px; flex-shrink:0; }
.item-info { flex:1; min-width:0; }
.item-title { font-weight:700; font-size:15px; }
.item-sub { font-size:12px; color:var(--text2); margin-top:2px; }
.progress-bar { height:8px; background:#E2E8F0; border-radius:4px; overflow:hidden; margin:8px 0; }
.progress-fill { height:100%; border-radius:4px; transition:width 0.4s; }
.form-group { margin-bottom:14px; }
.form-group label { display:block; font-size:13px; color:var(--text2); font-weight:600; margin-bottom:6px; }
.form-group input, .form-group select, .form-group textarea {
  width:100%; background:#F8FAFC; border:1px solid #E2E8F0; border-radius:12px; padding:12px 14px; font-size:15px; color:var(--text); outline:none;
}
.form-group input:focus, .form-group select:focus { border-color:var(--primary); }
.modal-overlay { position:fixed; inset:0; background:rgba(15,23,42,0.55); z-index:200; display:none; align-items:flex-end; justify-content:center; }
.modal-overlay.show { display:flex; }
.modal { background:#fff; width:100%; max-width:520px; border-radius:24px 24px 0 0; padding:22px 18px calc(26px + var(--safe-bottom)); max-height:92vh; overflow-y:auto; animation:slide 0.3s ease; }
@keyframes slide { from { transform:translateY(100%); } to { transform:none; } }
.modal-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:18px; }
.modal-header h2 { font-size:18px; font-weight:800; }
.close-btn { background:#F1F5F9; border:none; width:32px; height:32px; border-radius:50%; font-size:18px; }
.section-title { font-size:17px; font-weight:800; margin:20px 0 12px; }
.badge { display:inline-block; background:var(--primary-light); color:var(--primary); padding:3px 10px; border-radius:20px; font-size:11px; font-weight:700; }
.badge-diff { background:#FEF3C7; color:#D97706; }
.fab { position:fixed; right:18px; bottom:calc(105px + var(--safe-bottom)); width:58px; height:58px; border-radius:50%; background:var(--primary); color:#fff; border:none; font-size:30px; box-shadow:0 6px 22px rgba(79,70,229,0.45); z-index:90; display:flex; align-items:center; justify-content:center; }
.empty { text-align:center; padding:40px 16px; color:var(--text2); }
.special-card { border-left:4px solid var(--orange); background:#FFFBEB; }
.timer-box { font-size:42px; font-weight:800; text-align:center; padding:20px; background:var(--primary-light); border-radius:16px; margin:12px 0; color:var(--primary); }
</style>
</head>
<body>
<div class="header">
  <div>
    <h1>ÉcoleSync</h1>
    <div class="header-sub">Suivi scolaire • Difficultés • Suisse</div>
  </div>
  <div id="headerInfo" style="font-size:13px;font-weight:700;color:var(--primary)"></div>
</div>

<div id="page-home" class="page active"></div>
<div id="page-devoirs" class="page"></div>
<div id="page-exercices" class="page"></div>
<div id="page-suivi" class="page"></div>
<div id="page-plus" class="page"></div>

<button class="fab" id="fabBtn" onclick="openAddDevoir()">+</button>

<nav class="nav">
  <button class="nav-item active" onclick="go('home',this)">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>Accueil
  </button>
  <button class="nav-item" onclick="go('devoirs',this)">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>Devoirs
  </button>
  <button class="nav-item" onclick="go('exercices',this)">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3L1 9l4 2.18v6L12 21l7-3.82v-6l2-1.09V17h2V9L12 3zm6.82 6L12 12.72 5.18 9 12 5.28 18.82 9zM17 15.99l-5 2.73-5-2.73v-3.72L12 15l5-2.73v3.72z"/></svg>Exercices
  </button>
  <button class="nav-item" onclick="go('suivi',this)">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3.5 18.49l6-6.01 4 4L22 6.92l-1.41-1.41-7.09 7.97-4-4L2 16.99z"/></svg>Suivi
  </button>
  <button class="nav-item" onclick="go('plus',this)">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 10c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm12 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm-6 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg>Plus
  </button>
</nav>

<div class="modal-overlay" id="modal"><div class="modal" id="modalBody"></div></div>

<script>
const KEY = 'ecolesync_v1';
let data = { children: [], devoirs: [], observations: [], canton: 'Vaud' };
let currentChildId = null;
let timerInterval = null;
let timerSeconds = 0;

function load() {
  const s = localStorage.getItem(KEY);
  if (s) data = JSON.parse(s);
  else {
    data = {
      canton: 'Vaud',
      children: [
        { id: 1, name: 'Léa', age: 4, degree: '1P', color: '#EC4899', difficulties: [], notes: '' },
        { id: 2, name: 'Noah', age: 6, degree: '2P', color: '#3B82F6', difficulties: [], notes: '' },
        { id: 3, name: 'Emma', age: 8, degree: '5P', color: '#8B5CF6', difficulties: ['TDAH'], notes: 'Difficultés en 4P, surveiller 5P' },
        { id: 4, name: 'Liam', age: 2, degree: 'Préscolaire', color: '#10B981', difficulties: [], notes: '' }
      ],
      devoirs: [],
      observations: []
    };
    save();
  }
  if (data.children.length && !currentChildId) currentChildId = data.children[0].id;
}

function save() { localStorage.setItem(KEY, JSON.stringify(data)); }
function uid() { return Date.now() + Math.floor(Math.random() * 999); }
function $(id) { return document.getElementById(id); }
function getChild(id) { return data.children.find(c => c.id === id); }
function currentChild() { return getChild(currentChildId); }

function go(name, btn) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  $('page-' + name).classList.add('active');
  if (btn) btn.classList.add('active');
  $('fabBtn').style.display = (name === 'home' || name === 'devoirs') ? 'flex' : 'none';
  render(name);
}

function render(name) {
  if (name === 'home') renderHome();
  else if (name === 'devoirs') renderDevoirs();
  else if (name === 'exercices') renderExercices();
  else if (name === 'suivi') renderSuivi();
  else if (name === 'plus') renderPlus();
}

function renderHome() {
  const child = currentChild();
  $('headerInfo').textContent = child ? child.name + ' • ' + child.degree : '';
  
  let chips = data.children.map(c => 
    `<div class="child-chip ${c.id === currentChildId ? 'active' : ''}" onclick="selectChild(${c.id})">
      <span style="width:12px;height:12px;border-radius:50%;background:${c.color}"></span>
      ${c.name}
      ${c.difficulties.length ? '⚠️' : ''}
    </div>`
  ).join('');

  const todayDevoirs = data.devoirs.filter(d => d.childId === currentChildId && d.date === new Date().toISOString().slice(0,10));
  const done = todayDevoirs.filter(d => d.done).length;

  $('page-home').innerHTML = `
    <div style="margin-bottom:12px;overflow-x:auto;white-space:nowrap;padding-bottom:6px">${chips}</div>
    
    ${child && child.difficulties.length ? `
      <div class="card special-card">
        <div class="card-title">Besoins particuliers</div>
        <div style="font-weight:700;margin-bottom:6px">${child.difficulties.join(', ')}</div>
        <div style="font-size:13px;color:var(--text2)">${child.notes || 'Aucun commentaire supplémentaire'}</div>
        <button class="btn btn-sm btn-secondary" style="margin-top:10px" onclick="openEditChild(${child.id})">Modifier les besoins</button>
      </div>
    ` : ''}

    <div class="card">
      <div class="card-title">Aujourd'hui – ${child ? child.name : ''}</div>
      <div style="font-size:28px;font-weight:800;color:var(--primary)">${done}/${todayDevoirs.length} devoirs terminés</div>
      <div class="progress-bar"><div class="progress-fill" style="width:${todayDevoirs.length ? (done/todayDevoirs.length*100) : 0}%;background:var(--green)"></div></div>
    </div>

    <div class="section-title">Outils rapides ${child && child.difficulties.length ? '(adaptés)' : ''}</div>
    <div class="card" style="display:flex;gap:10px;flex-wrap:wrap">
      <button class="btn btn-sm" onclick="startTimer(5)">Timer 5 min</button>
      <button class="btn btn-sm" onclick="startTimer(10)">Timer 10 min</button>
      <button class="btn btn-sm btn-secondary" onclick="openEmotion()">Émotions</button>
      <button class="btn btn-sm btn-secondary" onclick="openBreakDown()">Découper un devoir</button>
    </div>

    <div id="timerDisplay" style="display:none" class="card">
      <div class="timer-box" id="timerValue">05:00</div>
      <button class="btn btn-danger" onclick="stopTimer()">Arrêter le timer</button>
    </div>

    <div class="section-title">Derniers devoirs</div>
    <div class="card" style="padding:6px 16px">
      ${todayDevoirs.length ? todayDevoirs.map(d => `
        <div class="list-item" onclick="toggleDevoir(${d.id})">
          <div class="icon-circle" style="background:${d.done ? '#D1FAE5' : '#FEE2E2'}">${d.done ? '✓' : '○'}</div>
          <div class="item-info">
            <div class="item-title">${d.title}</div>
            <div class="item-sub">${d.subject} ${d.difficulty ? '• ' + d.difficulty : ''}</div>
          </div>
        </div>
      `).join('') : '<div class="empty">Aucun devoir pour aujourd\'hui</div>'}
    </div>
  `;
}

function selectChild(id) {
  currentChildId = id;
  renderHome();
}

function renderDevoirs() {
  const list = data.devoirs.filter(d => d.childId === currentChildId).sort((a,b) => new Date(b.date) - new Date(a.date));
  $('page-devoirs').innerHTML = `
    <div class="section-title">Devoirs de ${currentChild()?.name || ''}</div>
    <div class="card" style="padding:6px 16px">
      ${list.length ? list.map(d => `
        <div class="list-item" onclick="editDevoir(${d.id})">
          <div class="icon-circle" style="background:${d.done ? '#D1FAE5' : '#FEE2E2'}">${d.done ? '✓' : '○'}</div>
          <div class="item-info">
            <div class="item-title">${d.title}</div>
            <div class="item-sub">${d.subject} • ${d.date} ${d.difficulty ? '• ' + d.difficulty : ''}</div>
          </div>
        </div>
      `).join('') : '<div class="empty">Aucun devoir enregistré</div>'}
    </div>
    <button class="btn" onclick="openAddDevoir()">+ Ajouter un devoir</button>
  `;
}

function renderExercices() {
  const child = currentChild();
  const isSpecial = child && child.difficulties.length > 0;
  $('page-exercices').innerHTML = `
    <div class="section-title">Exercices ${isSpecial ? '(mode adapté)' : ''}</div>
    
    ${isSpecial ? `
      <div class="card special-card">
        <div class="card-title">Mode besoins particuliers activé</div>
        <div style="font-size:14px">Les exercices sont plus courts, avec plus de visuel et de découpage en étapes.</div>
      </div>
    ` : ''}

    <div class="card">
      <div class="card-title">Mathématiques</div>
      <button class="btn btn-secondary" style="margin-bottom:8px" onclick="generateMath()">Générer des calculs</button>
      <div id="mathZone"></div>
    </div>

    <div class="card">
      <div class="card-title">Français – Lecture / Vocabulaire</div>
      <button class="btn btn-secondary" onclick="generateFrench()">Générer un exercice</button>
      <div id="frenchZone" style="margin-top:12px"></div>
    </div>

    <div class="card">
      <div class="card-title">Tables de multiplication</div>
      <button class="btn btn-secondary" onclick="generateTables()">S'entraîner</button>
      <div id="tablesZone" style="margin-top:12px"></div>
    </div>
  `;
}

function generateMath() {
  const child = currentChild();
  const isSpecial = child && child.difficulties.length > 0;
  let html = '';
  for (let i = 0; i < (isSpecial ? 4 : 6); i++) {
    const a = Math.floor(Math.random() * (isSpecial ? 10 : 20)) + 1;
    const b = Math.floor(Math.random() * (isSpecial ? 10 : 12)) + 1;
    html += `<div style="padding:12px;background:#F8FAFC;border-radius:12px;margin-bottom:8px;font-size:18px;font-weight:700">${a} + ${b} = ?</div>`;
  }
  $('mathZone').innerHTML = html;
}

function generateFrench() {
  const words = ['maison', 'école', 'ami', 'livre', 'jouer', 'courir', 'manger', 'soleil', 'fleur', 'chat'];
  const word = words[Math.floor(Math.random() * words.length)];
  $('frenchZone').innerHTML = `
    <div style="font-size:22px;font-weight:800;text-align:center;padding:20px;background:var(--primary-light);border-radius:16px">
      Écris une phrase avec le mot :<br><span style="color:var(--primary)">${word}</span>
    </div>
  `;
}

function generateTables() {
  const t = Math.floor(Math.random() * 8) + 2;
  let html = `<div style="font-weight:700;margin-bottom:10px">Table de ${t}</div>`;
  for (let i = 1; i <= 10; i++) {
    html += `<div style="padding:10px;background:#F8FAFC;border-radius:10px;margin-bottom:6px">${t} × ${i} = ?</div>`;
  }
  $('tablesZone').innerHTML = html;
}

function renderSuivi() {
  const child = currentChild();
  const obs = data.observations.filter(o => o.childId === currentChildId).slice(-8).reverse();
  $('page-suivi').innerHTML = `
    <div class="section-title">Suivi de ${child?.name || ''}</div>
    
    ${child?.difficulties.length ? `
      <div class="card special-card">
        <div class="card-title">Aménagements / Points d'attention</div>
        <div style="font-size:14px;margin-bottom:8px">${child.difficulties.join(' • ')}</div>
        <div style="font-size:13px;color:var(--text2)">${child.notes || 'Aucun note particulière'}</div>
      </div>
    ` : ''}

    <div class="card">
      <div class="card-title">Observations (parents & enseignants)</div>
      ${obs.length ? obs.map(o => `
        <div style="padding:12px 0;border-bottom:1px solid #F1F5F9">
          <div style="font-weight:700">${o.title}</div>
          <div style="font-size:13px;color:var(--text2)">${o.date} • ${o.author}</div>
          <div style="margin-top:4px;font-size:14px">${o.text}</div>
        </div>
      `).join('') : '<div class="empty">Aucune observation</div>'}
    </div>
    <button class="btn" onclick="openAddObservation()">+ Ajouter une observation</button>
  `;
}

function renderPlus() {
  $('page-plus').innerHTML = `
    <div class="section-title">Enfants</div>
    <div class="card" style="padding:6px 16px">
      ${data.children.map(c => `
        <div class="list-item" onclick="openEditChild(${c.id})">
          <div class="icon-circle" style="background:${c.color}22;color:${c.color}">${c.name[0]}</div>
          <div class="item-info">
            <div class="item-title">${c.name} ${c.difficulties.length ? '<span class="badge badge-diff">Besoins particuliers</span>' : ''}</div>
            <div class="item-sub">${c.degree} • ${c.age} ans</div>
          </div>
        </div>
      `).join('')}
    </div>
    <button class="btn btn-secondary" style="margin-bottom:16px" onclick="openAddChild()">+ Ajouter un enfant</button>

    <div class="section-title">Canton</div>
    <div class="card">
      <select id="cantonSelect" onchange="data.canton=this.value;save()" style="width:100%;padding:12px;border-radius:12px;border:1px solid #E2E8F0">
        <option value="Vaud" ${data.canton==='Vaud'?'selected':''}>Vaud</option>
        <option value="Genève" ${data.canton==='Genève'?'selected':''}>Genève</option>
        <option value="Fribourg" ${data.canton==='Fribourg'?'selected':''}>Fribourg</option>
        <option value="Valais" ${data.canton==='Valais'?'selected':''}>Valais</option>
        <option value="Neuchâtel" ${data.canton==='Neuchâtel'?'selected':''}>Neuchâtel</option>
        <option value="Jura" ${data.canton==='Jura'?'selected':''}>Jura</option>
        <option value="Autre" ${data.canton==='Autre'?'selected':''}>Autre canton</option>
      </select>
    </div>

    <div class="section-title">Ressources difficultés</div>
    <div class="card">
      <div style="font-size:14px;line-height:1.5">
        <strong>TDAH</strong> : découper les devoirs, timer, pauses fréquentes<br>
        <strong>TSA</strong> : routines visuelles, consignes claires, moins de bruit<br>
        <strong>Dyslexie</strong> : police adaptée, plus de temps, oral possible<br>
        <strong>Dyscalculie</strong> : supports concrets, schémas, calculatrice si autorisée
      </div>
    </div>

    <button class="btn btn-danger" style="margin-top:20px" onclick="if(confirm('Tout effacer ?')){localStorage.removeItem(KEY);location.reload()}">Réinitialiser</button>
  `;
}

// ===== MODALS & ACTIONS =====
function openModal(html) {
  $('modalBody').innerHTML = html;
  $('modal').classList.add('show');
}
function closeModal() { $('modal').classList.remove('show'); }

function openAddDevoir() {
  openModal(`
    <div class="modal-header"><h2>Nouveau devoir</h2><button class="close-btn" onclick="closeModal()">×</button></div>
    <div class="form-group"><label>Titre</label><input id="d-title" placeholder="Ex: Exercices maths page 24"></div>
    <div class="form-group"><label>Matière</label>
      <select id="d-subject"><option>Maths</option><option>Français</option><option>Allemand</option><option>Découverte</option><option>Autre</option></select>
    </div>
    <div class="form-group"><label>Difficulté ressentie</label>
      <select id="d-diff"><option value="">Normale</option><option>Facile</option><option>Difficile</option><option>Très difficile</option></select>
    </div>
    <div class="form-group"><label>Date</label><input type="date" id="d-date" value="${new Date().toISOString().slice(0,10)}"></div>
    <button class="btn" onclick="saveDevoir()">Ajouter</button>
  `);
}

function saveDevoir(id) {
  const title = $('d-title').value.trim();
  if (!title) return alert('Titre obligatoire');
  const obj = {
    title,
    subject: $('d-subject').value,
    difficulty: $('d-diff').value,
    date: $('d-date').value,
    childId: currentChildId,
    done: false
  };
  if (id) Object.assign(data.devoirs.find(d => d.id === id), obj);
  else { obj.id = uid(); data.devoirs.push(obj); }
  save(); closeModal(); render(document.querySelector('.page.active').id.replace('page-',''));
}

function editDevoir(id) {
  const d = data.devoirs.find(x => x.id === id);
  openModal(`
    <div class="modal-header"><h2>Modifier devoir</h2><button class="close-btn" onclick="closeModal()">×</button></div>
    <div class="form-group"><label>Titre</label><input id="d-title" value="${d.title}"></div>
    <div class="form-group"><label>Matière</label><select id="d-subject"><option ${d.subject==='Maths'?'selected':''}>Maths</option><option ${d.subject==='Français'?'selected':''}>Français</option><option ${d.subject==='Allemand'?'selected':''}>Allemand</option><option ${d.subject==='Découverte'?'selected':''}>Découverte</option><option ${d.subject==='Autre'?'selected':''}>Autre</option></select></div>
    <div class="form-group"><label>Difficulté</label><select id="d-diff"><option value="">Normale</option><option ${d.difficulty==='Facile'?'selected':''}>Facile</option><option ${d.difficulty==='Difficile'?'selected':''}>Difficile</option><option ${d.difficulty==='Très difficile'?'selected':''}>Très difficile</option></select></div>
    <div class="form-group"><label>Date</label><input type="date" id="d-date" value="${d.date}"></div>
    <div style="display:flex;gap:10px">
      <button class="btn btn-danger" onclick="deleteDevoir(${id})">Supprimer</button>
      <button class="btn" onclick="saveDevoir(${id})">Enregistrer</button>
    </div>
  `);
}

function deleteDevoir(id) {
  if (!confirm('Supprimer ce devoir ?')) return;
  data.devoirs = data.devoirs.filter(d => d.id !== id);
  save(); closeModal(); renderDevoirs();
}

function toggleDevoir(id) {
  const d = data.devoirs.find(x => x.id === id);
  d.done = !d.done;
  save(); renderHome();
}

function openAddChild() {
  openModal(`
    <div class="modal-header"><h2>Nouvel enfant</h2><button class="close-btn" onclick="closeModal()">×</button></div>
    <div class="form-group"><label>Prénom</label><input id="c-name"></div>
    <div class="form-group"><label>Âge</label><input type="number" id="c-age" value="6"></div>
    <div class="form-group"><label>Degré</label>
      <select id="c-degree">
        <option>Préscolaire</option>
        ${Array.from({length:12},(_,i)=>`<option>${i+1}P</option>`).join('')}
      </select>
    </div>
    <div class="form-group"><label>Besoins particuliers (TDAH, TSA, Dys...)</label>
      <input id="c-diff" placeholder="Ex: TDAH, Dyslexie (séparer par des virgules)">
    </div>
    <div class="form-group"><label>Notes / Aménagements</label><textarea id="c-notes" rows="3"></textarea></div>
    <button class="btn" onclick="saveChild()">Créer</button>
  `);
}

function openEditChild(id) {
  const c = getChild(id);
  openModal(`
    <div class="modal-header"><h2>Modifier ${c.name}</h2><button class="close-btn" onclick="closeModal()">×</button></div>
    <div class="form-group"><label>Prénom</label><input id="c-name" value="${c.name}"></div>
    <div class="form-group"><label>Âge</label><input type="number" id="c-age" value="${c.age}"></div>
    <div class="form-group"><label>Degré</label>
      <select id="c-degree">
        <option ${c.degree==='Préscolaire'?'selected':''}>Préscolaire</option>
        ${Array.from({length:12},(_,i)=>`<option ${c.degree===(i+1)+'P'?'selected':''}>${i+1}P</option>`).join('')}
      </select>
    </div>
    <div class="form-group"><label>Besoins particuliers</label>
      <input id="c-diff" value="${c.difficulties.join(', ')}" placeholder="TDAH, TSA, Dyslexie...">
    </div>
    <div class="form-group"><label>Notes / Aménagements</label><textarea id="c-notes" rows="3">${c.notes||''}</textarea></div>
    <div style="display:flex;gap:10px">
      <button class="btn btn-danger" onclick="deleteChild(${id})">Supprimer</button>
      <button class="btn" onclick="saveChild(${id})">Enregistrer</button>
    </div>
  `);
}

function saveChild(id) {
  const name = $('c-name').value.trim();
  if (!name) return alert('Prénom obligatoire');
  const diffs = $('c-diff').value.split(',').map(s => s.trim()).filter(Boolean);
  const obj = {
    name,
    age: +$('c-age').value || 0,
    degree: $('c-degree').value,
    difficulties: diffs,
    notes: $('c-notes').value.trim(),
    color: id ? getChild(id).color : ['#EC4899','#3B82F6','#8B5CF6','#10B981','#F59E0B'][data.children.length % 5]
  };
  if (id) Object.assign(getChild(id), obj);
  else { obj.id = uid(); data.children.push(obj); currentChildId = obj.id; }
  save(); closeModal(); render(document.querySelector('.page.active').id.replace('page-',''));
}

function deleteChild(id) {
  if (!confirm('Supprimer cet enfant et toutes ses données ?')) return;
  data.children = data.children.filter(c => c.id !== id);
  data.devoirs = data.devoirs.filter(d => d.childId !== id);
  data.observations = data.observations.filter(o => o.childId !== id);
  if (currentChildId === id) currentChildId = data.children[0]?.id || null;
  save(); closeModal(); renderHome();
}

function openAddObservation() {
  openModal(`
    <div class="modal-header"><h2>Nouvelle observation</h2><button class="close-btn" onclick="closeModal()">×</button></div>
    <div class="form-group"><label>Titre</label><input id="o-title" placeholder="Ex: Concentration en classe"></div>
    <div class="form-group"><label>Auteur</label><select id="o-author"><option>Parent</option><option>Enseignant</option><option>Autre</option></select></div>
    <div class="form-group"><label>Texte</label><textarea id="o-text" rows="4"></textarea></div>
    <button class="btn" onclick="saveObservation()">Enregistrer</button>
  `);
}

function saveObservation() {
  const title = $('o-title').value.trim();
  if (!title) return alert('Titre obligatoire');
  data.observations.push({
    id: uid(),
    childId: currentChildId,
    title,
    author: $('o-author').value,
    text: $('o-text').value.trim(),
    date: new Date().toLocaleDateString('fr-CH')
  });
  save(); closeModal(); renderSuivi();
}

function startTimer(min) {
  stopTimer();
  timerSeconds = min * 60;
  $('timerDisplay').style.display = 'block';
  updateTimerDisplay();
  timerInterval = setInterval(() => {
    timerSeconds--;
    updateTimerDisplay();
    if (timerSeconds <= 0) {
      stopTimer();
      alert('Timer terminé ! Bravo 💪');
    }
  }, 1000);
}

function updateTimerDisplay() {
  const m = Math.floor(timerSeconds / 60).toString().padStart(2, '0');
  const s = (timerSeconds % 60).toString().padStart(2, '0');
  $('timerValue').textContent = `${m}:${s}`;
}

function stopTimer() {
  clearInterval(timerInterval);
  $('timerDisplay').style.display = 'none';
}

function openEmotion() {
  openModal(`
    <div class="modal-header"><h2>Comment je me sens ?</h2><button class="close-btn" onclick="closeModal()">×</button></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
      <button class="btn btn-secondary" onclick="closeModal()">😊 Content</button>
      <button class="btn btn-secondary" onclick="closeModal()">😐 Neutre</button>
      <button class="btn btn-secondary" onclick="closeModal()">😔 Fatigué</button>
      <button class="btn btn-secondary" onclick="closeModal()">😤 Frustré</button>
      <button class="btn btn-secondary" onclick="closeModal()">😰 Stressé</button>
      <button class="btn btn-secondary" onclick="closeModal()">😴 Épuisé</button>
    </div>
  `);
}

function openBreakDown() {
  openModal(`
    <div class="modal-header"><h2>Découper un devoir</h2><button class="close-btn" onclick="closeModal()">×</button></div>
    <div style="font-size:14px;line-height:1.6">
      <p><strong>1.</strong> Lis la consigne une fois</p>
      <p><strong>2.</strong> Surligne les mots importants</p>
      <p><strong>3.</strong> Fais la première question seulement</p>
      <p><strong>4.</strong> Pause de 1 minute</p>
      <p><strong>5.</strong> Continue question par question</p>
      <p style="margin-top:12px;color:var(--text2)">Idéal pour TDAH et difficultés d'attention.</p>
    </div>
    <button class="btn" style="margin-top:16px" onclick="closeModal()">Compris</button>
  `);
}

// INIT
load();
renderHome();
</script>
</body>

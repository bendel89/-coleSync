<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#4F46E5">
<title>ÉcoleSync</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{--bg:#F8FAFC;--card:#fff;--text:#0F172A;--text2:#64748B;--primary:#4F46E5;--primary-light:#EEF2FF;--green:#10B981;--red:#EF4444;--orange:#F59E0B;--radius:16px;--safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0B1120;--card:#162033;--text:#F1F5F9;--text2:#94A3B8;--primary:#818CF8;--primary-light:#25305A}}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif}
body{background:var(--bg);color:var(--text);min-height:100%;padding-top:var(--safe-top);padding-bottom:calc(95px + var(--safe-bottom))}
.header{position:sticky;top:var(--safe-top);z-index:100;background:var(--card);padding:14px 18px;border-bottom:1px solid #E2E8F033;display:flex;justify-content:space-between;align-items:center}
.header h1{font-size:20px;font-weight:800;color:var(--primary)}.header-sub{font-size:12px;color:var(--text2)}
.nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);display:flex;justify-content:space-around;padding:10px 0 calc(14px + var(--safe-bottom));border-top:1px solid #E2E8F033;z-index:100}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--text2);font-size:10px;font-weight:600;background:none;border:none;padding:6px 8px}
.nav-item.active{color:var(--primary)}.nav-item svg{width:24px;height:24px}
.page{display:none;padding:16px;animation:fade .25s ease}.page.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.card{background:var(--card);border-radius:var(--radius);padding:16px;margin-bottom:14px;box-shadow:0 2px 12px rgba(0,0,0,.05)}
.card-title{font-size:13px;color:var(--text2);font-weight:600;margin-bottom:8px}
.btn{background:var(--primary);color:#fff;border:none;border-radius:12px;padding:14px;font-size:15px;font-weight:700;width:100%}
.btn:active{opacity:.85}.btn-secondary{background:#94A3B826;color:var(--text)}.btn-danger{background:var(--red)}
.btn-sm{padding:8px 14px;font-size:13px;width:auto;border-radius:10px}
.child-chip{display:inline-flex;align-items:center;gap:8px;background:var(--primary-light);color:var(--primary);padding:8px 14px;border-radius:30px;font-weight:700;font-size:14px;margin:4px;border:2px solid transparent}
.child-chip.active{border-color:var(--primary);background:var(--primary);color:#fff}
.list-item{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid #94A3B826}.list-item:last-child{border-bottom:none}
.icon-circle{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.item-info{flex:1;min-width:0}.item-title{font-weight:700;font-size:15px}.item-sub{font-size:12px;color:var(--text2);margin-top:2px}
.progress-bar{height:8px;background:#94A3B833;border-radius:4px;overflow:hidden;margin:8px 0}.progress-fill{height:100%;border-radius:4px;transition:width .4s}
.form-group{margin-bottom:14px}.form-group label{display:block;font-size:13px;color:var(--text2);font-weight:600;margin-bottom:6px}
.form-group input,.form-group select,.form-group textarea{width:100%;background:var(--bg);border:1px solid #94A3B844;border-radius:12px;padding:12px 14px;font-size:16px;color:var(--text);outline:none}
.modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:200;display:none;align-items:flex-end;justify-content:center}.modal-overlay.show{display:flex}
.modal{background:var(--card);width:100%;max-width:520px;border-radius:24px 24px 0 0;padding:22px 18px calc(26px + var(--safe-bottom));max-height:92%;overflow-y:auto;animation:slide .3s ease}
@keyframes slide{from{transform:translateY(100%)}to{transform:none}}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.modal-header h2{font-size:18px;font-weight:800}
.close-btn{background:#94A3B826;color:var(--text);border:none;width:32px;height:32px;border-radius:50%;font-size:18px}
.section-title{font-size:17px;font-weight:800;margin:20px 0 12px}
.badge{display:inline-block;background:var(--primary-light);color:var(--primary);padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700}.badge-diff{background:#FEF3C7;color:#D97706}
.fab{position:fixed;right:18px;bottom:calc(105px + var(--safe-bottom));width:58px;height:58px;border-radius:50%;background:var(--primary);color:#fff;border:none;font-size:30px;box-shadow:0 6px 22px rgba(79,70,229,.45);z-index:90;display:flex;align-items:center;justify-content:center}
.empty{text-align:center;padding:40px 16px;color:var(--text2)}
.special-card{border-left:4px solid var(--orange)}
.timer-box{font-size:42px;font-weight:800;text-align:center;padding:20px;background:var(--primary-light);border-radius:16px;margin:12px 0;color:var(--primary)}
.opt{display:block;width:100%;text-align:left;margin-bottom:8px}.ok{background:var(--green)!important;color:#fff!important}.ko{background:var(--red)!important;color:#fff!important}
.photo{width:100%;border-radius:14px;margin-bottom:12px;max-height:260px;object-fit:cover}
.ai{background:var(--primary-light);border-radius:14px;padding:12px;font-size:14px;line-height:1.5;margin-bottom:14px}
</style>
</head>
<body>
<div class="header"><div><h1>ÉcoleSync</h1><div class="header-sub">Suivi scolaire • Difficultés • Suisse</div></div><div id="headerInfo" style="font-size:13px;font-weight:700;color:var(--primary)"></div></div>
<div id="page-home" class="page active"></div><div id="page-devoirs" class="page"></div><div id="page-exercices" class="page"></div><div id="page-suivi" class="page"></div><div id="page-plus" class="page"></div>
<button class="fab" id="fabBtn" onclick="openAddDevoir()">+</button>
<nav class="nav">
<button class="nav-item active" onclick="go('home',this)"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>Accueil</button>
<button class="nav-item" onclick="go('devoirs',this)"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>Devoirs</button>
<button class="nav-item" onclick="go('exercices',this)"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3L1 9l4 2.18v6L12 21l7-3.82v-6l2-1.09V17h2V9L12 3zm6.82 6L12 12.72 5.18 9 12 5.28 18.82 9zM17 15.99l-5 2.73-5-2.73v-3.72L12 15l5-2.73v3.72z"/></svg>Exercices</button>
<button class="nav-item" onclick="go('suivi',this)"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M3.5 18.49l6-6.01 4 4L22 6.92l-1.41-1.41-7.09 7.97-4-4L2 16.99z"/></svg>Suivi</button>
<button class="nav-item" onclick="go('plus',this)"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 10c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm12 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm-6 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg>Plus</button>
</nav>
<div class="modal-overlay" id="voiceOv" style="z-index:300"><div class="modal" id="voiceBody"></div></div>
<div class="modal-overlay" id="modal"><div class="modal" id="modalBody"></div></div>

<script>
window.claude=window.claude||{use:async n=>{
  if(n!=='sample')return null;
  const b64=bl=>new Promise((ok,ko)=>{const f=new FileReader();f.onload=()=>ok(f.result.split(',')[1]);f.onerror=ko;f.readAsDataURL(bl)});
  const s=async(input,o={})=>{
    const key=localStorage.getItem('ecolesync_key');if(!key)throw{code:'absent'};
    let t=typeof input==='string'?[{role:'user',content:input}]:input.map(x=>({...x}));
    const m=[];t.forEach(x=>{const l=m[m.length-1];if(l&&l.role===x.role)l.content+='\n\n'+x.content;else m.push(x)});
    if(o.images){const bl=[].concat(o.images)[0];const last=m[m.length-1];last.content=[{type:'image',source:{type:'base64',media_type:'image/jpeg',data:await b64(bl)}},{type:'text',text:last.content}]}
    const model=(o.modelTier==='quick'&&!o.images)?'claude-haiku-4-5-20251001':'claude-sonnet-5-5';
    let res;try{res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model,max_tokens:1000,messages:m})})}catch(e){throw{code:'reseau'}}
    if(!res.ok)throw{code:res.status===401?'cle_invalide':'api_'+res.status};
    const d=await res.json(),text=(d.content||[]).map(c=>c.text||'').join('');
    if(o.onText)o.onText({text,delta:text});return{text}};
  s.json=async(i,o)=>{const {text}=await s(i,o);try{return JSON.parse(text.replace(/```json|```/g,'').trim())}catch(e){throw{code:'invalid_json'}}};
  s.limits=async()=>({images:{maxCount:1}});
  return s}};
const KEY='ecolesync_v2';
const SUBJ={Maths:['🔢','#DBEAFE'],'Français':['📖','#FCE7F3'],Allemand:['🇩🇪','#FEF3C7'],Sciences:['🔬','#D1FAE5'],'Découverte':['🌍','#EDE9FE'],Autre:['📌','#E2E8F0']};
const DE=[['rouge','rot'],['bleu','blau'],['vert','grün'],['jaune','gelb'],['maison','das Haus'],['chat','die Katze'],['chien','der Hund'],['école','die Schule'],['livre','das Buch'],['eau','das Wasser'],['pain','das Brot'],['mère','die Mutter'],['père','der Vater'],['un','eins'],['deux','zwei'],['trois','drei'],['bonjour','Guten Tag'],['merci','Danke'],['s\'il te plaît','Bitte'],['au revoir','Auf Wiedersehen']];
const SCI=[['Quelle planète est la plus proche du Soleil ?','Mercure',['Vénus','Mars','Jupiter']],['Que absorbent les plantes pour la photosynthèse ?','Le CO₂',['L\'azote','L\'hélium','Le sel']],['À quelle température l\'eau gèle-t-elle ?','0 °C',['10 °C','100 °C','-10 °C']],['Combien de pattes a un insecte ?','6',['4','8','10']],['Quel organe pompe le sang ?','Le cœur',['Le foie','Les poumons','L\'estomac']],['La glace est un état…','Solide',['Liquide','Gazeux','Magnétique']],['Quel animal est un mammifère ?','La baleine',['Le requin','Le saumon','Le crabe']],['Qu\'est-ce qui nous attire vers le sol ?','La gravité',['Le vent','La lumière','Le bruit']],['Combien de planètes dans le système solaire ?','8',['7','9','10']],['Quelle partie de la plante absorbe l\'eau ?','Les racines',['Les feuilles','Les fleurs','Les fruits']]];
let data,currentChildId=null,timerInterval=null,timerSeconds=0,pend=null,quiz=null;

function toast(m){let t=document.getElementById('toast');if(!t){t=document.createElement('div');t.id='toast';t.style.cssText='position:fixed;left:16px;right:16px;top:calc(var(--safe-top) + 70px);z-index:999;background:#0F172A;color:#fff;padding:14px 16px;border-radius:14px;font-size:14px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.3)';document.body.appendChild(t)}t.textContent=m;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',5000)}
window.alert=toast;
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function load(){
  let s=null;try{s=localStorage.getItem(KEY)||localStorage.getItem('ecolesync_v1')}catch(e){}
  if(s){try{data=JSON.parse(s)}catch(e){s=null}}
  if(!s){data={canton:'Vaud',children:[],devoirs:[],observations:[]}}
  data.points=data.points||{};
  data.children=data.children.filter(c=>!([1,2,3,4].includes(c.id)&&['Léa','Noah','Emma','Liam'].includes(c.name)&&!data.devoirs.some(d=>d.childId===c.id)&&!data.observations.some(o=>o.childId===c.id)));
  if(data.children.length)currentChildId=data.children[0].id;
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){alert('Mémoire pleine : supprime quelques photos de devoirs.')}}
const uid=()=>Date.now()+Math.floor(Math.random()*999);
const $=id=>document.getElementById(id);
const getChild=id=>data.children.find(c=>c.id===id);
const currentChild=()=>getChild(currentChildId);
const today=()=>new Date().toISOString().slice(0,10);
const pts=()=>data.points[currentChildId]||0;
function addPts(n){data.points[currentChildId]=pts()+n;save()}
const shuffle=a=>[...a].sort(()=>Math.random()-.5);
function subjIcon(s){const x=SUBJ[s]||SUBJ.Autre;return `<div class="icon-circle" style="background:${x[1]}">${x[0]}</div>`}

function go(name,btn){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  $('page-'+name).classList.add('active');if(btn)btn.classList.add('active');
  $('fabBtn').style.display=(name==='home'||name==='devoirs')?'flex':'none';render(name)}
function render(n){({home:renderHome,devoirs:renderDevoirs,exercices:renderExercices,suivi:renderSuivi,plus:renderPlus})[n]()}
const rerender=()=>render(document.querySelector('.page.active').id.replace('page-',''));

function devItem(d,fn,showDate){return `<div class="list-item" onclick="${fn}(${d.id})">
  ${d.done?'<div class="icon-circle" style="background:#D1FAE5">✓</div>':subjIcon(d.subject)}
  <div class="item-info"><div class="item-title">${esc(d.title)} ${d.photo?'📷':''}</div>
  <div class="item-sub">${esc(d.subject)}${showDate?' • '+d.date:''}${d.difficulty?' • '+esc(d.difficulty):''}${d.minutes?' • ~'+d.minutes+' min':''}</div></div></div>`}

function renderHome(){
  const child=currentChild();$('headerInfo').textContent=child?child.name+' • '+child.degree+' • ⭐'+pts():'';
  if(!child){$('page-home').innerHTML=`<div class="card" style="text-align:center;padding:28px 16px"><div style="font-size:40px">👋</div><div style="font-size:18px;font-weight:800;margin:8px 0">Bienvenue sur ÉcoleSync</div><div style="font-size:14px;color:var(--text2);margin-bottom:16px">Commence par ajouter ton premier enfant.</div><button class="btn" onclick="openAddChild()">+ Ajouter un enfant</button></div>`;return}
  const chips=data.children.map(c=>`<div class="child-chip ${c.id===currentChildId?'active':''}" onclick="selectChild(${c.id})"><span style="width:12px;height:12px;border-radius:50%;background:${c.color}"></span>${esc(c.name)} ${c.difficulties.length?'⚠️':''}</div>`).join('');
  const td=data.devoirs.filter(d=>d.childId===currentChildId&&d.date===today());
  const done=td.filter(d=>d.done).length;
  $('page-home').innerHTML=`
  <div style="margin-bottom:12px;overflow-x:auto;white-space:nowrap;padding-bottom:6px">${chips}</div>
  ${child&&child.difficulties.length?`<div class="card special-card"><div class="card-title">Besoins particuliers</div><div style="font-weight:700;margin-bottom:6px">${esc(child.difficulties.join(', '))}</div><div style="font-size:13px;color:var(--text2)">${esc(child.notes)||'Aucun commentaire supplémentaire'}</div><button class="btn btn-sm btn-secondary" style="margin-top:10px" onclick="openEditChild(${child.id})">Modifier les besoins</button></div>`:''}
  <div class="card"><div class="card-title">Aujourd'hui – ${esc(child?child.name:'')}</div>
  <div style="font-size:28px;font-weight:800;color:var(--primary)">${done}/${td.length} devoirs terminés</div>
  <div class="progress-bar"><div class="progress-fill" style="width:${td.length?done/td.length*100:0}%;background:var(--green)"></div></div></div>
  <button class="btn" style="margin-bottom:14px" onclick="openAddDevoir(true)">📷 Photographier un devoir</button>
  <button class="btn btn-secondary" style="margin-bottom:14px" onclick="openVoice()">🎙️ Aide vocale</button>
  <div class="section-title">Outils rapides ${child&&child.difficulties.length?'(adaptés)':''}</div>
  <div class="card" style="display:flex;gap:10px;flex-wrap:wrap">
  <button class="btn btn-sm" onclick="startTimer(5)">Timer 5 min</button><button class="btn btn-sm" onclick="startTimer(10)">Timer 10 min</button><button class="btn btn-sm" onclick="startTimer(25)">Pomodoro 25</button>
  <button class="btn btn-sm btn-secondary" onclick="openEmotion()">Émotions</button><button class="btn btn-sm btn-secondary" onclick="openBreakDown()">Découper un devoir</button></div>
  <div id="timerDisplay" style="display:none" class="card"><div class="timer-box" id="timerValue">05:00</div><button class="btn btn-danger" onclick="stopTimer()">Arrêter le timer</button></div>
  <div class="section-title">Devoirs du jour</div>
  <div class="card" style="padding:6px 16px">${td.length?td.map(d=>devItem(d,'toggleDevoir')).join(''):'<div class="empty">Aucun devoir pour aujourd\'hui</div>'}</div>`}
function selectChild(id){currentChildId=id;renderHome()}

function renderDevoirs(){
  const list=data.devoirs.filter(d=>d.childId===currentChildId).sort((a,b)=>new Date(b.date)-new Date(a.date));
  $('page-devoirs').innerHTML=`<div class="section-title">Devoirs de ${esc(currentChild()?.name||'')}</div>
  <div class="card" style="padding:6px 16px">${list.length?list.map(d=>devItem(d,'editDevoir',1)).join(''):'<div class="empty">Aucun devoir enregistré</div>'}</div>
  <button class="btn" style="margin-bottom:10px" onclick="openAddDevoir(true)">📷 Photographier un devoir</button>
  <button class="btn btn-secondary" onclick="openAddDevoir()">+ Ajouter manuellement</button>`}

function renderExercices(){
  const child=currentChild(),sp=child&&child.difficulties.length>0,de=child&&parseInt(child.degree)>=5;
  $('page-exercices').innerHTML=`<div class="section-title">Exercices ${sp?'(mode adapté)':''}</div>
  ${sp?'<div class="card special-card"><div class="card-title">Mode besoins particuliers activé</div><div style="font-size:14px">Exercices plus courts, plus visuels, découpés en étapes.</div></div>':''}
  <div class="card"><div class="card-title">🇩🇪 Allemand – Vocabulaire ${de?'':'(dès la 5P)'}</div><button class="btn btn-secondary" onclick="startQuiz('de')">Quiz de 5 mots</button><div id="zone-de" style="margin-top:12px"></div></div>
  <div class="card"><div class="card-title">🔬 Sciences – Quiz</div><button class="btn btn-secondary" onclick="startQuiz('sci')">Quiz de 5 questions</button><div id="zone-sci" style="margin-top:12px"></div></div>
  <div class="card"><div class="card-title">🔢 Mathématiques</div><button class="btn btn-secondary" onclick="generateMath()">Générer des calculs</button><div id="mathZone" style="margin-top:8px"></div></div>
  <div class="card"><div class="card-title">📖 Français – Vocabulaire</div><button class="btn btn-secondary" onclick="generateFrench()">Générer un exercice</button><div id="frenchZone" style="margin-top:12px"></div></div>
  <div class="card"><div class="card-title">✖️ Tables de multiplication</div><button class="btn btn-secondary" onclick="generateTables()">S'entraîner</button><div id="tablesZone" style="margin-top:12px"></div></div>`}

function startQuiz(kind){
  let items;
  if(kind==='de')items=shuffle(DE).slice(0,5).map(([fr,de])=>({q:`Comment dit-on « ${fr} » en allemand ?`,a:de,o:shuffle([de,...shuffle(DE.filter(x=>x[1]!==de)).slice(0,3).map(x=>x[1])])}));
  else items=shuffle(SCI).slice(0,5).map(([q,a,w])=>({q,a,o:shuffle([a,...w])}));
  quiz={kind,items,i:0,score:0};showQ()}
function showQ(){
  const z=$('zone-'+quiz.kind),it=quiz.items[quiz.i];
  z.innerHTML=`<div class="card-title">Question ${quiz.i+1}/5</div><div style="font-weight:800;font-size:17px;margin-bottom:12px">${esc(it.q)}</div>`+it.o.map((o,j)=>`<button class="btn btn-secondary opt" onclick="answerQ(${j},this)">${esc(o)}</button>`).join('')}
function answerQ(j,btn){
  const it=quiz.items[quiz.i],good=it.o[j]===it.a;
  document.querySelectorAll('.opt').forEach(b=>{b.disabled=true;if(b.textContent===it.a)b.classList.add('ok')});
  if(good)quiz.score++;else btn.classList.add('ko');
  setTimeout(()=>{quiz.i++;if(quiz.i<5)showQ();else{
    const p=quiz.score*5;addPts(p);
    $('zone-'+quiz.kind).innerHTML=`<div style="text-align:center;font-size:20px;font-weight:800">${quiz.score}/5 ${quiz.score>=4?'🎉':'💪'}<div style="font-size:14px;color:var(--text2);margin-top:6px">+${p} points ⭐</div></div>`;
    $('headerInfo').textContent=currentChild().name+' • '+currentChild().degree+' • ⭐'+pts()}},900)}

function generateMath(){
  const sp=currentChild()?.difficulties.length>0;let h='';
  for(let i=0;i<(sp?4:6);i++){const a=Math.floor(Math.random()*(sp?10:20))+1,b=Math.floor(Math.random()*(sp?10:12))+1;
    h+=`<div style="padding:12px;background:var(--bg);border-radius:12px;margin-bottom:8px;font-size:18px;font-weight:700">${a} + ${b} = ?</div>`}
  $('mathZone').innerHTML=h}
function generateFrench(){
  const w=['maison','école','ami','livre','jouer','courir','manger','soleil','fleur','chat'][Math.floor(Math.random()*10)];

function aiHtml(a){return a?`<div class="ai"><strong>🤖 ${esc(a.sujet||'')}</strong><br>Difficulté ${a.difficulte}/5 • ~${a.minutes} min<br>${(a.conseils||[]).map(c=>'• '+esc(c)).join('<br>')}</div>`:''}
function compress(file){return new Promise((res,rej)=>{
  const img=new Image(),u=URL.createObjectURL(file);
  img.onload=()=>{const k=Math.min(1,1100/Math.max(img.width,img.height)),c=document.createElement('canvas');
    c.width=img.width*k;c.height=img.height*k;c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);
    c.toBlob(b=>res({blob:b,url:c.toDataURL('image/jpeg',.6)}),'image/jpeg',.7)};
  img.onerror=rej;img.src=u})}
async function onPhoto(inp){
  const f=inp.files[0];if(!f)return;
  const r=await compress(f).catch(()=>null);if(!r)return alert('Photo illisible');
  pend.blob=r.blob;pend.photo=r.url;pend.ai=null;
  $('photoBox').innerHTML=`<img class="photo" src="${r.url}">`;
  $('aiBox').innerHTML='<div class="ai">🤖 Analyse du devoir en cours…</div>';
  analyse()}
async function analyse(){
  try{
    const s=await claude.use('sample');
    if(!s)throw 0;
    const caps=await s.limits().catch(()=>null);
    if(!caps?.images)throw 0;
    const c=currentChild();
    const a=await s.json(`Tu aides un parent en Suisse romande (Plan d'études romand). Voici la photo d'un devoir d'un enfant de ${c.degree}${c.difficulties.length?', avec besoins particuliers : '+c.difficulties.join(', '):''}. Réponds UNIQUEMENT en JSON : {"matiere":"Maths|Français|Allemand|Sciences|Découverte|Autre","titre":"titre court","sujet":"de quoi il s'agit, 1 phrase","difficulte":1-5,"minutes":durée estimée,"conseils":["2 à 3 conseils courts pour aider l'enfant"]}`,{images:pend.blob});
    pend.ai=a;pend.minutes=a.minutes;
    $('aiBox').innerHTML=aiHtml(a);
    if(SUBJ[a.matiere])$('d-subject').value=a.matiere;
    if(!$('d-title').value)$('d-title').value=a.titre||'';
    $('d-diff').value=a.difficulte>=5?'Très difficile':a.difficulte==4?'Difficile':a.difficulte<=2?'Facile':'';
  }catch(e){$('aiBox').innerHTML='<div class="ai">Analyse IA indisponible ('+esc((e&&e.code)||'non supportée ici')+') : la photo est quand même enregistrée, choisis la matière toi-même.</div>'}}

function saveDevoir(id){

  const obj={title,subject:$('d-subject').value,difficulty:$('d-diff').value,date:$('d-date').value,childId:currentChildId,photo:pend.photo,ai:pend.ai,minutes:pend.minutes};

function deleteDevoir(id){if(!confirm('Supprimer ce devoir ?'))return;data.devoirs=data.devoirs.filter(d=>d.id!==id);save();closeModal();renderDevoirs()}
function toggleDevoir(id){const d=data.devoirs.find(x=>x.id===id);d.done=!d.done;if(d.done)addPts(10);save();renderHome()}

function openAddObservation(){openModal(`<div class="modal-header"><h2>Nouvelle observation</h2><button class="close-btn" onclick="closeModal()">×</button></div><div class="form-group"><label>Titre</label><input id="o-title" placeholder="Ex: Concentration en classe"></div><div class="form-group"><label>Auteur</label><select id="o-author"><option>Parent</option><option>Enseignant</option><option>Autre</option></select></div><div class="form-group"><label>Texte</label><textarea id="o-text" rows="4"></textarea></div><button class="btn" onclick="saveObservation()">Enregistrer</button>`)}

// ===== AIDE VOCALE =====
let vTurns=[],vBlob=null,vRec=null,vBusy=false;
function dataUrlToBlob(u){const b=atob(u.split(',')[1]),a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return new Blob([a],{type:'image/jpeg'})}
function openVoice(blob){
  vTurns=[];vBlob=blob||null;vBusy=false;
  $('voiceBody').innerHTML=`<div class="modal-header"><h2>🎙️ Aide vocale</h2><div><button class="close-btn" onclick="speechSynthesis.cancel()" title="Stop">🔇</button> <button class="close-btn" onclick="closeVoice()">×</button></div></div>
  <div id="vLog" style="min-height:90px;max-height:38vh;overflow-y:auto;margin-bottom:12px"><div class="ai">Prends le devoir en photo, puis appuie sur le micro et dis par exemple : « Je n'arrive pas à résoudre ce problème, explique-moi. » Je te réponds à voix haute.</div></div>
  <div id="vAi" style="font-size:13px;color:var(--text2);margin-bottom:6px"></div><div id="vPhoto" style="font-size:13px;color:var(--text2);margin-bottom:8px">${vBlob?'📎 Photo jointe':''}</div>
  <label class="btn btn-secondary" style="display:block;text-align:center;margin-bottom:10px">📷 ${vBlob?'Changer la photo':'Photographier le problème'}<input type="file" accept="image/*" capture="environment" style="display:none" onchange="vPick(this)"></label>
  <div style="display:flex;gap:8px"><input id="vIn" enterkeyhint="send" onkeydown="if(event.key==='Enter')vSend()" placeholder="Écris ou dicte avec le micro 🎤 du clavier…" style="flex:1;border-radius:12px;border:1px solid #94A3B844;padding:12px;font-size:16px;background:var(--bg);color:var(--text)"><button class="btn" id="micBtn" style="width:56px" onclick="toggleMic()">🎙️</button><button class="btn" style="width:56px" onclick="vSend()">➤</button></div>`;
  $('voiceOv').classList.add('show');
  (async()=>{try{const s=await claude.use('sample');if(!s)$('vAi').textContent='⚠️ L\'IA n\'est pas disponible dans cette fenêtre.'}catch(e){$('vAi').textContent='⚠️ IA indisponible ('+((e&&e.code)||'?')+')'}})()}
function closeVoice(){speechSynthesis.cancel();try{vRec&&vRec.stop()}catch(e){}$('voiceOv').classList.remove('show')}
async function vPick(inp){const f=inp.files[0];if(!f)return;const r=await compress(f).catch(()=>null);if(!r)return;vBlob=r.blob;$('vPhoto').textContent='📎 Photo jointe'}
function vBubble(role,t){const d=document.createElement('div');d.className=role==='user'?'item-sub':'ai';d.style.cssText=role==='user'?'text-align:right;margin:8px 0;font-size:14px;color:var(--text)':'';d.textContent=t;$('vLog').appendChild(d);$('vLog').scrollTop=1e6;return d}
function speak(t){try{
  const ss=window.speechSynthesis;ss.cancel();ss.resume();
  const parts=t.replace(/[*#_`]/g,'').match(/[^.!?\n]+[.!?]*/g)||[t];
  const v=ss.getVoices().find(v=>v.lang&&v.lang.startsWith('fr'));
  parts.forEach(x=>{if(!x.trim())return;const u=new SpeechSynthesisUtterance(x.trim());u.lang='fr-FR';u.rate=.95;u.volume=1;if(v)u.voice=v;ss.speak(u)})}catch(e){vStatus('Voix indisponible ici.')}}
function unlockSpeech(){try{const u=new SpeechSynthesisUtterance(' ');u.volume=0;speechSynthesis.speak(u)}catch(e){}}
let vListening=false;
function vStatus(t){const e=$('vPhoto');if(e)e.textContent=t}
function micReset(){vListening=false;vRec=null;const b=$('micBtn');if(b)b.textContent='🎙️'}
function toggleMic(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){vStatus('Micro indisponible ici : utilise le micro 🎤 du clavier iPhone.');$('vIn').focus();return}
  if(vListening){try{vRec.stop()}catch(e){}setTimeout(()=>{if(vListening){micReset();if($('vIn').value.trim())vSend()}},700);return}
  try{speechSynthesis.cancel()}catch(e){}
  try{
    vRec=new SR();vRec.lang='fr-FR';vRec.interimResults=true;vRec.continuous=false;
    vRec.onstart=()=>{vListening=true;$('micBtn').textContent='⏹️';vStatus('🎙️ Je t\'écoute… (touche ⏹️ quand tu as fini)')};
    vRec.onresult=e=>{$('vIn').value=[...e.results].map(r=>r[0].transcript).join('')};
    vRec.onerror=e=>{micReset();if(e.error==='not-allowed'||e.error==='service-not-allowed')$('vIn').focus();vStatus(e.error==='not-allowed'||e.error==='service-not-allowed'?'Micro bloqué dans cette fenêtre. Touche le champ ci-dessous et appuie sur le micro 🎤 du clavier iPhone, puis sur ➤.':e.error==='no-speech'?'Je n\'ai rien entendu, réessaie.':'Erreur micro : '+e.error)};
    vRec.onend=()=>{const had=vListening;micReset();if(had&&$('vIn').value.trim()){vStatus('');vSend()}};
    vRec.start();vStatus('Démarrage du micro…');
  }catch(e){micReset();vStatus('Micro impossible : '+(e.message||e)+'. Utilise le micro 🎤 du clavier.')}}
async function vSend(){
  const inp=$('vIn'),text=inp.value.trim();if(vBusy)return vStatus('Je réfléchis encore, un instant…');if(!text){vStatus('Écris ou dicte d\'abord ta question (micro 🎤 du clavier), puis touche ➤.');inp.focus();return}vStatus('');
  unlockSpeech();
  inp.value='';vBubble('user',text);vTurns.push({role:'user',content:text});
  const el=vBubble('ai','Je réfléchis…');vBusy=true;
  const msgs={absent:'Ajoute d\'abord ta clé IA : onglet Plus > Clé IA.',cle_invalide:'Ta clé IA est refusée. Vérifie-la dans Plus > Clé IA.',reseau:'Pas de connexion ou accès bloqué.',not_granted:'Tu as refusé l\'accès à Claude. Relance et accepte la demande.',rate_limited:'Trop de demandes, attends un instant.',cancelled:''};
  try{
    const s=await claude.use('sample');if(!s)throw {code:'absent'};
    const caps=await s.limits().catch(()=>null),c=currentChild();
    const intro=`Tu es un tuteur bienveillant pour un enfant de ${c?c.degree:'primaire'} en Suisse romande (Plan d'études romand)${c&&c.difficulties.length?', avec besoins particuliers : '+c.difficulties.join(', '):''}. Tes réponses sont lues à voix haute : phrases courtes et simples, en français, sans markdown, sans liste, sans émojis. Explique étape par étape et guide l'enfant avec une petite question, sans donner directement la réponse finale. Si une photo est jointe, c'est le devoir : commence par dire ce que tu y vois. Sois encourageant.`;
    const withImg=!!(vBlob&&caps&&caps.images);
    const run=img=>s([{role:'user',content:intro},...vTurns],{modelTier:img?'default':'quick',cache:false,onText:({text})=>{el.textContent=text},...(img?{images:vBlob}:{})});
    let r;
    try{r=await run(withImg)}catch(e){
      if(withImg&&/image|invalid_request|transform/.test(e&&e.code||'')){el.textContent='Je ne peux pas lire la photo, je réponds sans.';r=await run(false)}else throw e}
    el.textContent=r.text;vTurns.push({role:'assistant',content:r.text});const sb=document.createElement('button');sb.className='btn btn-sm';sb.style.cssText='display:block;margin-top:10px';sb.textContent='🔊 Écouter la réponse';sb.onclick=()=>speak(r.text);el.appendChild(sb);speak(r.text);
  }catch(e){
    const code=(e&&e.code)||'inconnue';
    el.textContent=msgs[code]!==undefined?msgs[code]:'Désolé, ça n\'a pas marché (code : '+code+'). Réessaie ou envoie-moi ce code.';
    vTurns.pop()}
  vBusy=false;$('vLog').scrollTop=1e6}

// ===== TIMER / ÉMOTIONS =====
function startTimer(min){stopTimer();timerSeconds=min*60;$('timerDisplay').style.display='block';updateTimer();
  timerInterval=setInterval(()=>{timerSeconds--;updateTimer();if(timerSeconds<=0){stopTimer();alert('Timer terminé ! Bravo 💪')}},1000)}
function updateTimer(){$('timerValue').textContent=String(Math.floor(timerSeconds/60)).padStart(2,'0')+':'+String(timerSeconds%60).padStart(2,'0')}
function stopTimer(){clearInterval(timerInterval);const t=$('timerDisplay');if(t)t.style.display='none'}
function openEmotion(){openModal(`<div class="modal-header"><h2>Comment je me sens ?</h2><button class="close-btn" onclick="closeModal()">×</button></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">${['😊 Content','😐 Neutre','😔 Fatigué','😤 Frustré','😰 Stressé','😴 Épuisé'].map(e=>`<button class="btn btn-secondary" onclick="closeModal()">${e}</button>`).join('')}</div>`)}
function openBreakDown(){openModal(`<div class="modal-header"><h2>Découper un devoir</h2><button class="close-btn" onclick="closeModal()">×</button></div><div style="font-size:14px;line-height:1.7"><p><strong>1.</strong> Lis la consigne une fois</p><p><strong>2.</strong> Surligne les mots importants</p><p><strong>3.</strong> Fais la première question seulement</p><p><strong>4.</strong> Pause de 1 minute</p><p><strong>5.</strong> Continue question par question</p><p style="margin-top:12px;color:var(--text2)">Idéal pour TDAH et difficultés d'attention.</p></div><button class="btn" style="margin-top:16px" onclick="closeModal()">Compris</button>`)}

load();renderHome();
